<!doctype html><html><head><meta charset="utf-8"><title>PSX pistol and courier body verification</title><link rel="icon" href="../favicon.svg"></head><body><canvas id="raster"></canvas><script type="module">
import * as T from '../vendor/three.module.js';import {PSXPipeline} from '../graphics/psx-renderer.js';import {makeGearPalette} from '../graphics/gear-materials.js';import {makePistol,posePistol} from '../graphics/pistol.js';import {makePlayerBody,posePlayerBody} from '../graphics/player-body.js';import {gripDiagnostics} from '../graphics/weapon-rig.js';
const pipe=new PSXPipeline(document.getElementById('raster'));pipe.resize(960,720);const scene=new T.Scene(),gear=new T.Scene(),camera=new T.PerspectiveCamera(72,4/3,.01,5),m=makeGearPalette(),pistol=makePistol(m),body=makePlayerBody(m);gear.add(pistol,body);scene.background=new T.Color(0,0,0);
function pixels(){const gl=pipe.renderer.getContext(),a=new Uint8Array(960*720*4);gl.readPixels(0,0,960,720,gl.RGBA,gl.UNSIGNED_BYTE,a);return a;}
window.verifyPistolArt=()=>{
 let maxGap=0,maxLengthError=0,triggerGap=0,poses=0;
 for(const recoil of [0,.04,.12])for(const reload of [0,.15,.5,.85,1.2,1.7])for(const empty of [false,true]){posePistol(pistol,{recoil,reload,empty});const d=gripDiagnostics(pistol);for(const a of d.arms){maxGap=Math.max(maxGap,a.wristGap);maxLengthError=Math.max(maxLengthError,Math.abs(a.upperLength-.37),Math.abs(a.foreLength-.37));}triggerGap=Math.max(triggerGap,d.triggerGap);poses++;}
 posePistol(pistol);pistol.updateMatrixWorld(true);let highest=-Infinity,nearestDepth=Infinity;
 pistol.userData.rig.tool.traverse(o=>{if(!o.isMesh)return;const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){const v=new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);if(v.z<-.05){nearestDepth=Math.min(nearestDepth,-v.z);highest=Math.max(highest,v.clone().project(camera).y);}}});const weaponTop=(1-highest)/2;
 body.visible=false;pipe.configure({affine:true,vertexSnap:true,dither:true});pipe.render(scene,camera,gear,camera);const a=pixels();pipe.configure({affine:false,vertexSnap:false,dither:false});pipe.render(scene,camera,gear,camera);const b=pixels();let nativeChanged=0,drawn=0;const levels=new Set();for(let i=0;i<a.length;i+=4){if(a[i]||a[i+1]||a[i+2]){drawn++;levels.add(a[i]);}for(let k=0;k<3;k++)if(a[i+k]!==b[i+k])nativeChanged++;}
 pistol.visible=false;body.visible=true;posePlayerBody(body,{pitch:-1.3});pipe.render(scene,camera,gear,camera);const idle=pixels();body.userData.boots.forEach(o=>o.visible=false);pipe.render(scene,camera,gear,camera);const noBoots=pixels();let bootPixels=0;for(let i=0;i<idle.length;i+=4)if(idle[i]!==noBoots[i]||idle[i+1]!==noBoots[i+1]||idle[i+2]!==noBoots[i+2])bootPixels++;body.userData.boots.forEach(o=>o.visible=true);posePlayerBody(body,{pitch:-1.3,walk:2.8,moving:true});pipe.render(scene,camera,gear,camera);const stride=pixels();let bodyPixels=0,stridePixels=0;for(let i=0;i<idle.length;i+=4){if(idle[i]||idle[i+1]||idle[i+2])bodyPixels++;if(idle[i]!==stride[i]||idle[i+1]!==stride[i+1]||idle[i+2]!==stride[i+2])stridePixels++;}
 let painted=0,nearest=true;pistol.traverse(o=>{const mat=o.material;if(mat?.uniforms?.painted?.value){painted++;nearest&&=mat.uniforms.paint.value.magFilter===T.NearestFilter&&mat.uniforms.paint.value.image.width===256;}});
 return {weaponTop,nearestDepth,poses,maxGap,maxLengthError,triggerGap,nativeChanged,drawn,levels:levels.size,bodyPixels,stridePixels,bootPixels,painted,nearest};
};
</script></body></html>
