<!doctype html><html><head><link rel="icon" href="../favicon.svg"></head><body><canvas id="c"></canvas><script type="module">
import * as T from '../vendor/three.module.js';import{PSXPipeline}from'../graphics/psx-renderer.js';import{createSmoke}from'../graphics/blunt.js';
const pipe=new PSXPipeline(document.getElementById('c'));pipe.resize(640,480);const world=new T.Scene(),gear=new T.Scene(),cam=new T.PerspectiveCamera(72,4/3,.01,10);world.background=new T.Color(.04,.06,.08);const emitter=new T.Group(),tip=new T.Object3D();tip.position.set(.1,-.1,-.6);emitter.add(tip);emitter.userData.smokeTip=tip;const smoke=createSmoke(gear);
const pixels=()=>{const a=new Uint8Array(640*480*4);pipe.renderer.getContext().readPixels(0,0,640,480,6408,5121,a);return a;};
window.verifySmokeBatch=()=>{smoke.clear();pipe.render(world,cam,gear,cam);const base=pixels();for(let i=0;i<120;i++)smoke.tick(1/60,emitter,1.8,true);pipe.renderer.info.autoReset=false;pipe.renderer.info.reset();pipe.render(world,cam,gear,cam);const after=pixels(),calls=pipe.renderer.info.render.calls;let visible=0;for(let i=0;i<after.length;i+=4)if(after[i]>base[i]+2)visible++;const active=smoke.diagnostics;smoke.clear();pipe.render(world,cam,gear,cam);const clear=pixels();let residual=0;for(let i=0;i<clear.length;i++)if(clear[i]!==base[i])residual++;return{active,calls,visible,residual};};
</script></body></html>
