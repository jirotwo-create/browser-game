<!doctype html><html><head><link rel="icon" href="../favicon.svg"></head><body><canvas id="c"></canvas><script type="module">
import * as T from '../vendor/three.module.js';import{PSXPipeline}from'../graphics/psx-renderer.js';import{batchRigidParts}from'../graphics/rigid-batches.js';import{gearSurface}from'../graphics/gear-materials.js';
const pipe=new PSXPipeline(document.getElementById('c'));pipe.resize(640,480);const scene=new T.Scene(),cam=new T.PerspectiveCamera(65,4/3,.1,20);cam.position.z=5;
let root=new T.Group();scene.add(root);const mats=[pipe.material(0x98ba78),pipe.material(0xad568a)];
for(let n=0;n<4;n++){const joint=new T.Group();joint.name='joint'+n;joint.position.set((n%2-.5)*2,(Math.floor(n/2)-.5)*1.8,0);root.add(joint);for(let i=0;i<12;i++){const g=new T.BoxGeometry(.23,.25,.18);g.setAttribute('color',new T.Float32BufferAttribute(new Array(g.attributes.position.count*3).fill(.9),3));const mesh=new T.Mesh(g,mats[i%2]);mesh.position.set((i%4-1.5)*.25,(Math.floor(i/4)-1)*.25,(i%3)*.03);mesh.rotation.set(i*.01,i*.03,0);mesh.scale.set(1+i*.01,.8+i*.02,1.3);joint.add(mesh);}const independent=new T.Mesh(new T.OctahedronGeometry(.14),mats[0]);independent.name='independent';independent.userData.independentPose=true;independent.position.y=.7;joint.add(independent);}
const control=root.clone(true);root.removeFromParent();const removed=batchRigidParts(root);const read=()=>{const a=new Uint8Array(640*480*4);pipe.renderer.getContext().readPixels(0,0,640,480,6408,5121,a);return a;};
window.verifyBatches=()=>{const poses=[];const nativeMaterials=[gearSurface(0x98ba78),gearSurface(0xad568a)];for(const native of [false,true]){if(native){root=control.clone(true);for(const r of [root,control])r.traverse(o=>{if(o.isMesh)o.material=nativeMaterials[mats.indexOf(o.material)];});batchRigidParts(root);}for(const time of [0,.7,1.4]){for(const r of [root,control])for(let n=0;n<4;n++){r.getObjectByName('joint'+n).rotation.set(time*.1,n*.07+time*.1,Math.sin(time+n)*.1);r.getObjectByName('joint'+n).getObjectByName('independent').rotation.z=time;}
scene.add(control);pipe.renderer.info.autoReset=false;pipe.renderer.info.reset();pipe.render(native?new T.Scene():scene,cam,native?scene:null,cam);const before=read(),beforeCalls=pipe.renderer.info.render.calls,beforeTriangles=pipe.renderer.info.render.triangles;scene.remove(control);scene.add(root);pipe.renderer.info.reset();pipe.render(native?new T.Scene():scene,cam,native?scene:null,cam);const after=read();let changed=0;for(let i=0;i<after.length;i+=4)if(after[i]!==before[i]||after[i+1]!==before[i+1]||after[i+2]!==before[i+2])changed++;poses.push({native,changed,beforeCalls,afterCalls:pipe.renderer.info.render.calls,beforeTriangles,afterTriangles:pipe.renderer.info.render.triangles});scene.remove(root);}}
return{removed,poses,independent:root.getObjectByName('independent').userData.independentPose};};
</script></body></html>
