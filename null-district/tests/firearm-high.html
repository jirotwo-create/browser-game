<!doctype html><html><head><link rel="icon" href="../favicon.svg"><title>Actual surface UV intoxication</title></head><body><canvas id="c"></canvas><script type="module">
import * as T from '../vendor/three.module.js';import{PSXPipeline}from'../graphics/psx-renderer.js';import{makeGearPalette}from'../graphics/gear-materials.js';import{makePistol}from'../graphics/pistol.js';import{makeCarbine}from'../graphics/models.js';
const pipeline=new PSXPipeline(document.getElementById('c'));pipeline.resize(960,720);pipeline.configure({dither:false,vertexSnap:false});const scene=new T.Scene(),fg=new T.Scene(),cam=new T.OrthographicCamera(-1,1,.75,-.75,.1,10);cam.position.z=2;scene.background=new T.Color(.04,.10,.16);
const data=new Uint8Array(128*128*4);for(let y=0;y<128;y++)for(let x=0;x<128;x++){const i=(y*128+x)*4;data[i]=x*2;data[i+1]=y*2;data[i+2]=((x>>3)^(y>>3))%2*255;data[i+3]=255;}
const tex=new T.DataTexture(data,128,128);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.needsUpdate=true;
const mat=pipeline.material(0xffffff,tex,1,1);mat.uniforms.fogRange.value.set(100,200);
for(const x of [-.71,0,.71]){const g=new T.PlaneGeometry(.47,1.15);g.setAttribute('color',new T.Float32BufferAttribute(new Array(g.attributes.position.count*3).fill(1),3));const mesh=new T.Mesh(g,mat);mesh.position.x=x;scene.add(mesh);}
const foreground=new T.Mesh(new T.PlaneGeometry(.28,.18),new T.MeshBasicMaterial({color:0x38d586}));foreground.position.set(.55,-.5,.5);fg.add(foreground);
const pixels=()=>{const a=new Uint8Array(960*720*4);pipeline.renderer.getContext().readPixels(0,0,960,720,6408,5121,a);return a;};
const raw=()=>{const a=new Uint8Array(320*240*4);pipeline.renderer.readRenderTargetPixels(pipeline.target,0,0,320,240,a);return a;};
const changed=(a,b)=>{let n=0;for(let i=0;i<a.length;i+=4)if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2])n++;return n;};
window.verifyFirearmHigh=()=>{
 pipeline.setIntoxication(0);pipeline.render(scene,cam,fg,cam);const base=pixels(),rawBase=raw();
 pipeline.setIntoxication(1,1.15);pipeline.render(scene,cam,fg,cam);const high=pixels(),rawHigh=raw();let centerChanged=0,edgeChanged=0,gearChanged=0;
 for(let y=0;y<720;y++)for(let x=0;x<960;x++){const i=(y*960+x)*4,c=base[i]!==high[i]||base[i+1]!==high[i+1]||base[i+2]!==high[i+2],radius=Math.hypot((x+.5-480)/720,(y+.5-360)/720);if(!c)continue;if(radius<.035)centerChanged++;if(radius>.3)edgeChanged++;if(x>686&&x<795&&y>82&&y<156)gearChanged++;}
 pipeline.setIntoxication(1,1.65);pipeline.render(scene,cam,fg,cam);const temporalChanged=changed(high,pixels());
 // Read UV coordinates from the WORLD render target, before post/presentation.
 mat.uniforms.debugUV.value=1;pipeline.setIntoxication(0);pipeline.render(scene,cam);const coords=raw();pipeline.setIntoxication(1,1.15);pipeline.render(scene,cam);const distorted=raw();let edgeUVDisplacement=0,focusUVDisplacement=0;
 for(let y=0;y<240;y++)for(let x=0;x<320;x++){const i=(y*320+x)*4,r=Math.hypot((x+.5-160)/240,(y+.5-120)/240),d=Math.hypot(coords[i]-distorted[i],coords[i+1]-distorted[i+1])/255;if(r<.14)focusUVDisplacement=Math.max(focusUVDisplacement,d);if(r>.4)edgeUVDisplacement=Math.max(edgeUVDisplacement,d);}
 mat.uniforms.debugUV.value=0;
 // A solid texture cannot change under UV motion. Every silhouette, gap and
 // background pixel must stay byte-identical, including during a moving swirl.
 mat.uniforms.tex.value=pipeline.white;pipeline.setIntoxication(0);pipeline.render(scene,cam,fg,cam);const solid=pixels();pipeline.setIntoxication(1,2.8);pipeline.render(scene,cam,fg,cam);const silhouetteChanged=changed(solid,pixels());mat.uniforms.tex.value=tex;
 pipeline.setIntoxication(0,10);pipeline.render(scene,cam,fg,cam);const residual=changed(base,pixels());
 // Newly loaded chapter materials must join the current effect immediately.
 pipeline.setIntoxication(.75,3);const fresh=pipeline.material();const lateMaterialStrength=fresh.uniforms.highStrength.value;pipeline.setIntoxication(0);
 const palette=makeGearPalette(),guns=[makePistol(palette),makeCarbine(palette)],tapers=[];for(const gun of guns){let barrel;gun.traverse(o=>{if(o.name.includes('tapered')&&o.isMesh)barrel=o;});const p=barrel.geometry.attributes.position;barrel.geometry.computeBoundingBox();const b=barrel.geometry.boundingBox,range=b.max.z-b.min.z,front=[],rear=[];for(let i=0;i<p.count;i++){if(p.getZ(i)<b.min.z+range*.035)front.push(p.getX(i));if(p.getZ(i)>b.max.z-range*.035)rear.push(p.getX(i));}const bounds=a=>[Math.min(...a),Math.max(...a)],f=bounds(front),r=bounds(rear);tapers.push({name:gun.name,muzzleWidth:f[1]-f[0],rearWidth:r[1]-r[0],offset:(f[1]+f[0]-r[1]-r[0])/2});}
 return{centerChanged,edgeChanged,gearChanged,temporalChanged,edgeUVDisplacement,focusUVDisplacement,rawChanged:changed(rawBase,rawHigh),silhouetteChanged,residual,lateMaterialStrength,tapers};
};
</script></body></html>
