<!doctype html><html><head><link rel="icon" href="../favicon.svg"><title>Firearm shapes and peripheral exhale spirals</title></head><body><canvas id="c"></canvas><script type="module">
import * as T from '../vendor/three.module.js';import{PSXPipeline}from'../graphics/psx-renderer.js';import{makeGearPalette}from'../graphics/gear-materials.js';import{makePistol}from'../graphics/pistol.js';import{makeCarbine}from'../graphics/models.js';
const pipeline=new PSXPipeline(document.getElementById('c'));pipeline.resize(960,720);pipeline.configure({dither:false});const scene=new T.Scene(),fg=new T.Scene(),cam=new T.Camera();
scene.add(new T.Mesh(new T.PlaneGeometry(2,2),new T.ShaderMaterial({uniforms:{probe:{value:0}},vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:'uniform float probe;varying vec2 v;void main(){if(probe>0.){gl_FragColor=vec4(v,0.,1.);return;}gl_FragColor=vec4(step(.5,fract(v.x*12.)),step(.5,fract(v.y*10.)),step(.5,fract((v.x+v.y)*8.)),1.);}'})));
const foreground=new T.Mesh(new T.PlaneGeometry(.3,.25),new T.MeshBasicMaterial({color:0x38d586}));foreground.position.set(.55,-.55,-.5);fg.add(foreground);
const pixels=()=>{const a=new Uint8Array(960*720*4);pipeline.renderer.getContext().readPixels(0,0,960,720,6408,5121,a);return a;};
window.verifyFirearmHigh=()=>{
 pipeline.setIntoxication(0);pipeline.render(scene,cam,fg,cam);const base=pixels();pipeline.setIntoxication(1,1.15);pipeline.render(scene,cam,fg,cam);const high=pixels();let centerChanged=0,edgeChanged=0,gearChanged=0;
 for(let y=6;y<714;y++)for(let x=6;x<954;x++){const i=(y*960+x)*4,changed=base[i]!==high[i]||base[i+1]!==high[i+1]||base[i+2]!==high[i+2],radius=Math.hypot((x+.5)/960-.5,(y+.5)/720-.5);if(!changed)continue;if(radius<.035)centerChanged++;if(radius>.3)edgeChanged++;if(x>676&&x<812&&y>122&&y<204)gearChanged++;

 }
 pipeline.setIntoxication(1,1.65);pipeline.render(scene,cam,fg,cam);const later=pixels();let temporalChanged=0;for(let i=0;i<high.length;i+=4)if(high[i]!==later[i]||high[i+1]!==later[i+1]||high[i+2]!==later[i+2])temporalChanged++;
 const originalPost=pipeline.postMaterial.fragmentShader;pipeline.postMaterial.fragmentShader='uniform sampler2D frame;varying vec2 vUv;void main(){gl_FragColor=texture2D(frame,vUv);}';pipeline.postMaterial.needsUpdate=true;scene.children[0].material.uniforms.probe.value=1;pipeline.setIntoxication(0);pipeline.render(scene,cam);const coords=pixels();pipeline.setIntoxication(1,1.15);pipeline.render(scene,cam);const distorted=pixels();let edgeDisplacement=0,focusDisplacement=0;
 for(let y=16;y<704;y++)for(let x=16;x<944;x++){const i=(y*960+x)*4,r=Math.hypot(((x+.5)/960-.5)*960/720,(y+.5)/720-.5),distance=Math.hypot((coords[i]-distorted[i])*960/255,(coords[i+1]-distorted[i+1])*720/255);if(r<.14)focusDisplacement=Math.max(focusDisplacement,distance);if(r>.4)edgeDisplacement=Math.max(edgeDisplacement,distance);}
 pipeline.postMaterial.fragmentShader=originalPost;pipeline.postMaterial.needsUpdate=true;scene.children[0].material.uniforms.probe.value=0;
 pipeline.setIntoxication(0,10);pipeline.render(scene,cam,fg,cam);const after=pixels();let residual=0;for(let i=0;i<base.length;i++)if(base[i]!==after[i])residual++;
 const palette=makeGearPalette(),guns=[makePistol(palette),makeCarbine(palette)],tapers=[];for(const gun of guns){let barrel;gun.traverse(o=>{if(o.name.includes('tapered')&&o.isMesh)barrel=o;});const p=barrel.geometry.attributes.position;barrel.geometry.computeBoundingBox();const b=barrel.geometry.boundingBox,range=b.max.z-b.min.z,front=[],rear=[];for(let i=0;i<p.count;i++){if(p.getZ(i)<b.min.z+range*.035)front.push(p.getX(i));if(p.getZ(i)>b.max.z-range*.035)rear.push(p.getX(i));}const bounds=a=>[Math.min(...a),Math.max(...a)],f=bounds(front),r=bounds(rear);tapers.push({name:gun.name,muzzleWidth:f[1]-f[0],rearWidth:r[1]-r[0],offset:(f[1]+f[0]-r[1]-r[0])/2});}
 return{centerChanged,edgeChanged,gearChanged,temporalChanged,edgeDisplacement,focusDisplacement,residual,tapers};
};
</script></body></html>
