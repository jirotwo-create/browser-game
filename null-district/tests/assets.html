<!doctype html><html><head><meta charset="utf-8"><title>Human and sword model review</title><link rel="icon" href="../favicon.svg"><style>body{margin:0;background:#242332;color:#dccbb6;font:14px monospace}canvas{width:100vw;height:100vh;image-rendering:pixelated}p{position:absolute;bottom:16px;left:24px}</style></head><body><canvas id="view"></canvas><p>HUMAN SABLE MERCENARIES / MOURNFANG · ACTUAL GAME MODELS</p><script type="module">
import * as THREE from '../vendor/three.module.js';import{PSXPipeline}from'../graphics/psx-renderer.js';import{makePalette}from'../graphics/textures.js';import{makeGuard,makeSword}from'../graphics/models.js';
