<!doctype html><html><head><meta charset="utf-8"><title>Japanese advertisement proof</title><link rel="icon" href="../favicon.svg"><style>body{margin:24px;background:#141621;color:#e7e5da;font:14px monospace}h1{color:#36f1fa}#ads{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}canvas{width:100%;image-rendering:pixelated}small{display:block;padding:6px;color:#bfbfd0}</style></head><body><h1>NEON CITY / JAPANESE ADVERTISEMENT PROOF</h1><p>Bundled District JP font · actual world-texture artwork · persistent copy with animated frames</p><div id="ads"></div><script type="module">
import{ADVERTS,prepareSignFonts,paintAdvert}from'../graphics/signage.js';await prepareSignFonts();
const metrics=[];
for(const[key,ad]of Object.entries(ADVERTS)){const canvas=paintAdvert(ad,0),second=paintAdvert(ad,1),ctx=canvas.getContext('2d');const jpSize=ad.jp.length<=2?112:ad.jp.length===3?99:84;ctx.font=`700 ${jpSize}px DistrictJP`;const headlineWidth=ctx.measureText(ad.jp).width;ctx.font='700 38px DistrictJP';const englishWidth=ctx.measureText(ad.en).width;ctx.font='700 43px DistrictJP';const offerWidth=ctx.measureText(ad.offer).width;const pixels=ctx.getImageData(0,0,512,256).data,other=second.getContext('2d').getImageData(0,0,512,256).data;let headlineDiff=0,frameDiff=0;for(let y=0;y<256;y++)for(let x=0;x<512;x++){const i=(y*512+x)*4;if(pixels[i]!==other[i]||pixels[i+1]!==other[i+1]||pixels[i+2]!==other[i+2]){if(y>40&&y<140)headlineDiff++;else frameDiff++;}}metrics.push({key,...ad,headlineWidth,englishWidth,offerWidth,headlineDiff,frameDiff});const card=document.createElement('div');card.append(canvas);const caption=document.createElement('small');caption.textContent=ad.jp+' / '+ad.en;card.append(caption);document.getElementById('ads').append(card);}
const aspects=[];for(const ad of Object.values(ADVERTS))for(const ratio of [.6,.75,1.4,2,3.2]){const canvas=paintAdvert(ad,0,ratio);aspects.push({ratio,actual:canvas.width/canvas.height})}
window.advertProof={aspects,fontReady:document.fonts.check('700 48px DistrictJP'),metrics};
</script></body></html>
